<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6bff"/>
      <stop offset="100%" stop-color="#5b4de8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a594ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c6bff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Subtle inner glow overlay -->
  <rect width="32" height="32" rx="8" fill="url(#glow)"/>

  <!-- CPU chip body -->
  <rect x="9" y="9" width="14" height="14" rx="2.5" fill="none" stroke="white" stroke-width="1.6" stroke-opacity="0.95"/>

  <!-- CPU center cross lines -->
  <line x1="13" y1="9" x2="13" y2="23" stroke="white" stroke-width="0.9" stroke-opacity="0.35"/>
  <line x1="16" y1="9" x2="16" y2="23" stroke="white" stroke-width="0.9" stroke-opacity="0.35"/>
  <line x1="19" y1="9" x2="19" y2="23" stroke="white" stroke-width="0.9" stroke-opacity="0.35"/>
  <line x1="9" y1="13" x2="23" y2="13" stroke="white" stroke-width="0.9" stroke-opacity="0.35"/>
  <line x1="9" y1="16" x2="23" y2="16" stroke="white" stroke-width="0.9" stroke-opacity="0.35"/>
  <line x1="9" y1="19" x2="23" y2="19" stroke="white" stroke-width="0.9" stroke-opacity="0.35"/>

  <!-- CPU pins — top -->
  <line x1="13" y1="5.5" x2="13" y2="9" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="16" y1="5.5" x2="16" y2="9" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="19" y1="5.5" x2="19" y2="9" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- CPU pins — bottom -->
  <line x1="13" y1="23" x2="13" y2="26.5" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="16" y1="23" x2="16" y2="26.5" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="19" y1="23" x2="19" y2="26.5" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- CPU pins — left -->
  <line x1="5.5" y1="13" x2="9" y2="13" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="5.5" y1="16" x2="9" y2="16" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="5.5" y1="19" x2="9" y2="19" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- CPU pins — right -->
  <line x1="23" y1="13" x2="26.5" y2="13" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="23" y1="16" x2="26.5" y2="16" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="23" y1="19" x2="26.5" y2="19" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>
</svg>